<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e"/>
      <stop offset="100%" style="stop-color:#0b0f19"/>
    </linearGradient>
    <linearGradient id="card" x1="135deg" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="192" ry="192" fill="url(#bg)"/>

  <!-- Ambient glow blob -->
  <ellipse cx="512" cy="430" rx="300" ry="280" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Purple card -->
  <rect x="287" y="210" width="450" height="450" rx="96" ry="96"
        fill="url(#card)" filter="url(#shadow)"/>

  <!-- Lightning bolt — Lucide Zap polygon scaled to fit 450x450 box at (287,210) -->
  <!-- Original lucide points: 13,2 3,14 12,14 11,22 21,10 12,10 scaled x14.5 offset (287+85=372, 210+37=247) -->
  <polygon
    points="560,247 417,451 519,451 506,573 659,369 557,369"
    fill="white"
  />

  <!-- MetaFlow wordmark -->
  <text
    x="512" y="748"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
    font-size="84"
    font-weight="800"
    letter-spacing="-3"
    fill="#ffffff"
  >MetaFlow</text>

  <!-- .AI label -->
  <text
    x="512" y="828"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="8"
    fill="#a78bfa"
  >.AI</text>
</svg>
